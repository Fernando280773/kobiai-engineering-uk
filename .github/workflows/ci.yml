name: CI — Real Quality Gates

# This CI actually checks things. A green tick here means the work really passed —
# it is NOT a placeholder. Red blocks the merge; no human or AI can override it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-and-format:
    name: Docs + formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dev tooling
        run: npm install --no-save markdownlint-cli@0.41.0 prettier@3.3.3
      - name: Lint markdown
        run: npx markdownlint "**/*.md" --ignore node_modules
      - name: Check formatting
        run: npx prettier --check "**/*.{md,json,yml,yaml}"

  migration-test:
    name: Database migration test (real)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kobiai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # psql is pre-installed on ubuntu-latest runners — no apt-get needed.
      - name: Verify psql is available
        run: psql --version
      - name: Run migration test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/kobiai_test
          PGCONNECT_TIMEOUT: 10
        run: |
          chmod +x scripts/test-migrations.sh
          ./scripts/test-migrations.sh

  app-build:
    name: App typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        # Publishable (anon) keys are safe to expose — they are designed for
        # browsers and every table is protected by RLS. Build-time only.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://bvhafvntlhibpwtdofgj.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_x9hj7deJRdZt2bcpgd3k5A_OGNFT2FP
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
